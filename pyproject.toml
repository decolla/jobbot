[project]
name = "jobbot"
version = "0.1.0"
description = "Agente pessoal de candidaturas a vagas"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "httpx>=0.27",
    "playwright>=1.45",
    "pydantic>=2.7",
    "pypdf>=4.2",
    "pyyaml>=6.0",
]

[project.scripts]
jobbot = "jobbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jobbot"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["browser: exige o Chromium do Playwright instalado"]
